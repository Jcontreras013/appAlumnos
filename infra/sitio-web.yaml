# Sitio web de Jc-System (jcsystemhn.com): archivos en un bucket S3 privado y servidos por CloudFront
# con HTTPS. Lo sube el flujo «Publicar el sitio de Jc-System» (.github/workflows/sitio-web.yml); no
# hace falta tocarlo en la consola.
#
# Sin certificado (primera vez, mientras se valida en el DNS) el sitio queda en la dirección de
# CloudFront (dxxxx.cloudfront.net). Con el certificado validado se agregan jcsystemhn.com y www.
AWSTemplateFormatVersion: "2010-09-09"
Description: Sitio web de Jc-System (S3 + CloudFront).
Parameters:
  Dominio:
    Type: String
    Default: jcsystemhn.com
    AllowedPattern: "^[a-z0-9.-]+$"
    Description: Dominio del sitio (sin www).
  CertificadoArn:
    Type: String
    Default: ""
    Description: Certificado de ACM en us-east-1 para el dominio y www (vacío mientras se valida).
Conditions:
  ConDominio: !Not [!Equals [!Ref CertificadoArn, ""]]
Resources:
  Archivos:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: proyecto
          Value: sitio-jcsystem

  AccesoCloudFront:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # www.jcsystemhn.com lleva a jcsystemhn.com, y /carpeta/ abre /carpeta/index.html.
  Direcciones:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-direcciones"
      AutoPublish: true
      FunctionConfig:
        Comment: www al dominio y páginas index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var host = req.headers.host ? req.headers.host.value : "";
          if (host.indexOf("www.") === 0) {
            return {
              statusCode: 301,
              statusDescription: "Moved Permanently",
              headers: { location: { value: "https://" + host.slice(4) + req.uri } },
            };
          }
          var uri = req.uri;
          if (uri.endsWith("/")) {
            req.uri = uri + "index.html";
          } else if (uri.lastIndexOf(".") < uri.lastIndexOf("/")) {
            req.uri = uri + "/index.html";
          }
          return req;
        }

  Distribucion:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Sitio de Jc-System
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If
          - ConDominio
          - [!Ref Dominio, !Sub "www.${Dominio}"]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - ConDominio
          - AcmCertificateArn: !Ref CertificadoArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: archivos
            DomainName: !GetAtt Archivos.RegionalDomainName
            OriginAccessControlId: !GetAtt AccesoCloudFront.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: archivos
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Políticas administradas de AWS: CachingOptimized y SecurityHeadersPolicy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt Direcciones.FunctionMetadata.FunctionARN
        # S3 responde 403 cuando un archivo no existe (el bucket no se puede listar).
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: proyecto
          Value: sitio-jcsystem

  PermisoLectura:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Archivos
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Archivos.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribucion}"
          - Sid: SoloHttps
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt Archivos.Arn
              - !Sub "${Archivos.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  Bucket:
    Value: !Ref Archivos
  DistribucionId:
    Value: !Ref Distribucion
  DominioCloudFront:
    Description: A donde apuntan jcsystemhn.com y www en el DNS.
    Value: !GetAtt Distribucion.DomainName
