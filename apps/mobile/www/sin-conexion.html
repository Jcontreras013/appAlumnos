<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · CONECTA</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 26rem;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        padding: 1.75rem 1.5rem;
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1rem;
        background: #0b8a6b;
        color: #fff;
        font-weight: 700;
        font-size: 1.5rem;
      }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { color: #475569; line-height: 1.5; margin: 0 0 1rem; }
      button {
        width: 100%;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.85rem 1rem;
        background: #0b8a6b;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }
      button:active { background: #086f57; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">C</span>
      <h1>No hay conexión</h1>
      <p>
        CONECTA necesita internet para abrir la primera vez. Revisa los datos o el wifi y vuelve a
        intentar.
      </p>
      <p>
        Si ya habías abierto tu cuaderno o guardado libros de la biblioteca, se abrirán sin internet en
        cuanto la app cargue una vez con conexión.
      </p>
      <button type="button" id="retry">Volver a intentar</button>
    </main>
    <!-- conecta-url.js lo escribe scripts/after-sync.mjs con la dirección que abre la app. -->
    <script src="conecta-url.js"></script>
    <script>
      const retry = () => {
        if (window.CONECTA_URL) window.location.href = window.CONECTA_URL;
        else window.history.back();
      };
      document.getElementById("retry").addEventListener("click", retry);
      // Al volver la señal, se reintenta solo.
      window.addEventListener("online", retry);
    </script>
  </body>
</html>
