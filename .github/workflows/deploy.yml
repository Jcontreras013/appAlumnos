# Despliegue manual a AWS (Actions → "Desplegar en AWS" → Run workflow).
# Antes, una vez: la plantilla infra/aws-github.yaml en CloudFormation (secreto AWS_DEPLOY_ROLE_ARN) y
# el flujo «Preparar AWS (una vez)». Este flujo encuentra solo, por su nombre en AWS, las llaves que
# creó «Preparar AWS» y el certificado del dominio (variable DOMINIO); producción no se despliega sin
# certificado validado.
# Opcionales, también por su nombre en Secrets Manager (o con su ARN en una variable):
#   escolar/<ambiente>/anthropic, /gemini o /groq  llave del asistente de planificación (el valor es la llave)
#   escolar/<ambiente>/fcm                         cuenta de servicio de Firebase (clave FCM_SERVICE_ACCOUNT)
# Variables: AWS_REGION, DOMINIO, GEMINI_MODEL, GROQ_MODEL. Secreto ALERT_EMAIL: correo de las alarmas.
# Ver docs/despliegue.md. El registro es público: aquí no se imprime ninguna llave ni correo.
name: Desplegar en AWS

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Ambiente
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    timeout-minutes: 60
    env:
      STAGE: ${{ inputs.stage }}
      DOMINIO: ${{ vars.DOMINIO }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          mask-aws-account-id: true

      - name: Rol de AWS para los contenedores (ECS)
        run: |
          set -euo pipefail
          # En una cuenta nueva, ECS crea su rol vinculado la primera vez que se usa y a veces no
          # está listo a tiempo para el clúster («ECS Service Linked Role is not ready»). Se crea
          # antes, una sola vez.
          if aws iam get-role --role-name AWSServiceRoleForECS >/dev/null 2>&1; then
            echo "El rol de ECS ya existe."
          else
            aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com >/dev/null
            echo "Rol de ECS creado; esperando que AWS lo active..."
            sleep 30
          fi

      - name: Buscar las llaves y el certificado en AWS
        env:
          JWT_SECRET_ARN: ${{ vars.JWT_SECRET_ARN }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          ANTHROPIC_SECRET_ARN: ${{ vars.ANTHROPIC_SECRET_ARN }}
          GEMINI_SECRET_ARN: ${{ vars.GEMINI_SECRET_ARN }}
          GROQ_SECRET_ARN: ${{ vars.GROQ_SECRET_ARN }}
          PUSH_SECRET_ARN: ${{ vars.PUSH_SECRET_ARN }}
          FCM_SECRET_ARN: ${{ vars.FCM_SECRET_ARN }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$ACCOUNT"
          secret() {
            aws secretsmanager describe-secret --secret-id "escolar/$STAGE/$1" --query ARN --output text 2>/dev/null || true
          }
          {
            echo "JWT_SECRET_ARN=${JWT_SECRET_ARN:-$(secret identity-jwt)}"
            echo "PUSH_SECRET_ARN=${PUSH_SECRET_ARN:-$(secret push)}"
            echo "FCM_SECRET_ARN=${FCM_SECRET_ARN:-$(secret fcm)}"
            echo "ANTHROPIC_SECRET_ARN=${ANTHROPIC_SECRET_ARN:-$(secret anthropic)}"
            echo "GEMINI_SECRET_ARN=${GEMINI_SECRET_ARN:-$(secret gemini)}"
            echo "GROQ_SECRET_ARN=${GROQ_SECRET_ARN:-$(secret groq)}"
          } >> "$GITHUB_ENV"
          if [ -z "$(secret identity-jwt)" ] && [ -z "$JWT_SECRET_ARN" ]; then
            echo "::error::No están las llaves de las sesiones: corre primero «Preparar AWS (una vez)»."
            exit 1
          fi
          if [ -z "$CERTIFICATE_ARN" ] && [ -n "$DOMINIO" ]; then
            CERTIFICATE_ARN=$(aws acm list-certificates --certificate-statuses ISSUED \
              --query "CertificateSummaryList[?DomainName=='$DOMINIO'].CertificateArn | [0]" --output text)
            [ "$CERTIFICATE_ARN" = "None" ] && CERTIFICATE_ARN=""
          fi
          if [ "$STAGE" = "prod" ] && [ -z "$CERTIFICATE_ARN" ]; then
            echo "::error::El certificado HTTPS de ${DOMINIO:-(falta la variable DOMINIO)} no está validado todavía. Corre «Preparar AWS (una vez)» y crea en el DNS el registro que muestra."
            exit 1
          fi
          echo "CERTIFICATE_ARN=$CERTIFICATE_ARN" >> "$GITHUB_ENV"
          for name in anthropic gemini groq fcm push; do
            [ -n "$(secret "$name")" ] && echo "Con escolar/$STAGE/$name." || true
          done

      - name: cdk deploy
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL || vars.ALERT_EMAIL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: |
          set -euo pipefail
          ARGS=(-c "stage=$STAGE" -c "jwtSecretArn=$JWT_SECRET_ARN")
          if [ -n "$CERTIFICATE_ARN" ]; then ARGS+=(-c "certificateArn=$CERTIFICATE_ARN"); fi
          if [ -n "$ALERT_EMAIL" ]; then ARGS+=(-c "alertEmail=$ALERT_EMAIL"); fi
          if [ -n "$ANTHROPIC_SECRET_ARN" ]; then ARGS+=(-c "anthropicSecretArn=$ANTHROPIC_SECRET_ARN"); fi
          if [ -n "$GEMINI_SECRET_ARN" ]; then ARGS+=(-c "geminiSecretArn=$GEMINI_SECRET_ARN"); fi
          if [ -n "$GEMINI_MODEL" ]; then ARGS+=(-c "geminiModel=$GEMINI_MODEL"); fi
          if [ -n "$GROQ_SECRET_ARN" ]; then ARGS+=(-c "groqSecretArn=$GROQ_SECRET_ARN"); fi
          if [ -n "$GROQ_MODEL" ]; then ARGS+=(-c "groqModel=$GROQ_MODEL"); fi
          if [ -n "$PUSH_SECRET_ARN" ]; then ARGS+=(-c "pushSecretArn=$PUSH_SECRET_ARN"); fi
          if [ -n "$FCM_SECRET_ARN" ]; then ARGS+=(-c "fcmSecretArn=$FCM_SECRET_ARN"); fi
          if ! pnpm --filter @escolar/infra exec cdk deploy --all --require-approval never \
            --outputs-file "$RUNNER_TEMP/salidas.json" "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/cdk.log"; then
            if grep -q "free tier customers" "$RUNNER_TEMP/cdk.log"; then
              echo "::error::El plan gratuito de AWS no permite este despliegue ($STAGE). dev cabe en el plan gratuito; prod necesita pasar la cuenta al plan de pago (AWS → Facturación y administración de costos → Planes; los créditos se conservan)."
            fi
            exit 1
          fi

      - name: Revisar que el panel llegue a identity y academic
        run: |
          set -euo pipefail
          URL=$(jq -r '.[] | .UrlPanel // empty' "$RUNNER_TEMP/salidas.json" | head -n1)
          CLUSTER=$(jq -r '.[] | .NombreCluster // empty' "$RUNNER_TEMP/salidas.json" | head -n1)
          # Con dominio se revisa por https con su certificado, aunque el DNS todavía no apunte aquí.
          revisar() {
            local destino=$URL extra=()
            if [ -n "$DOMINIO" ] && [[ "$URL" == https://* ]]; then
              extra=(--connect-to "$DOMINIO:443:${URL#https://}:443")
              destino="https://$DOMINIO"
            fi
            curl -sS --max-time 20 -o "$RUNNER_TEMP/servicios.json" -w "%{http_code}" "${extra[@]}" \
              "$destino/api/health/servicios" 2>/dev/null || true
          }
          esperar() {
            for _ in 1 2 3 4 5 6; do
              CODIGO=$(revisar)
              [ "$CODIGO" = "200" ] && return 0
              sleep 10
            done
            return 1
          }
          if esperar; then
            echo "El panel llega a identity y academic."
            exit 0
          fi
          # Service Connect: una tarea solo encuentra los servicios que ya existían cuando arrancó.
          # Reiniciar academic y el panel lo resuelve (sin cortar: las tareas nuevas entran antes).
          echo "::warning::El panel no llega a los servicios (código $CODIGO). Reiniciando academic y el panel..."
          SERVICIOS=$(aws ecs list-services --cluster "$CLUSTER" --query serviceArns --output text \
            | tr '\t' '\n' | grep -E 'AcademicService|WebService' || true)
          for s in $SERVICIOS; do
            aws ecs update-service --cluster "$CLUSTER" --service "$s" --force-new-deployment > /dev/null
          done
          # shellcheck disable=SC2086
          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICIOS
          if esperar; then
            echo "Después de reiniciar, el panel llega a identity y academic."
          else
            echo "::error::El panel sigue sin llegar a identity o academic: $(cat "$RUNNER_TEMP/servicios.json" 2>/dev/null || echo "sin respuesta"). Revisa los registros de los servicios en CloudWatch (AWS)."
            exit 1
          fi

      - name: Qué sigue
        run: |
          set -euo pipefail
          URL=$(jq -r '.[] | .UrlPanel // empty' "$RUNNER_TEMP/salidas.json" | head -n1)
          BALANCEADOR=${URL#*://}
          {
            echo "## CONECTA desplegada ($STAGE)"
            echo
            if [ -n "$DOMINIO" ]; then
              echo "1. En el DNS del dominio, un registro que lleve **$DOMINIO** al balanceador:"
              echo
              echo "   | Tipo | Nombre | Valor |"
              echo "   |---|---|---|"
              echo "   | CNAME | \`$DOMINIO\` | \`$BALANCEADOR\` |"
              echo
              echo "   (Si ya existe de un despliegue anterior, no hay que cambiarlo.)"
              echo "2. Abre https://$DOMINIO/login. Si es la primera vez, corre «Crear la cuenta del equipo de la plataforma»."
            else
              echo "Panel (sin dominio, solo para probar): $URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
