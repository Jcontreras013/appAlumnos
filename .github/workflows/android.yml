name: App Android

# Compila el APK de prueba de la app de CONECTA (apps/mobile), para instalar directo en un teléfono.
# La versión para Google Play sale del flujo «App Android para Play Store» (android-play.yml).
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
#   CONECTA_URL     Dirección pública de CONECTA con https (opcional: si no, la app de prueba deja
#                   escribir la dirección al abrirla).
#   CONECTA_APP_ID  Identificador en Play Store (opcional; por defecto com.jcsystem.conecta).
# Secreto opcional GOOGLE_SERVICES_JSON: el archivo de Firebase, para los avisos del teléfono.
# Ver apps/mobile/README.md.

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compilar la app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONECTA_URL: ${{ vars.CONECTA_URL }}
      CONECTA_APP_ID: ${{ vars.CONECTA_APP_ID }}
      # Play Store pide que el número de versión siempre suba: se usa el número de esta compilación.
      CONECTA_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Revisar la configuración de la app
        run: pnpm --filter @escolar/mobile typecheck
      - name: Archivo de Firebase (avisos del teléfono)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
            echo "Con avisos del teléfono (Firebase)."
          else
            echo "::notice::Sin GOOGLE_SERVICES_JSON: la app se compila sin avisos del teléfono."
          fi
      - name: Preparar la app (Capacitor)
        run: pnpm --filter @escolar/mobile sync
      - name: APK de prueba
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: conecta-prueba-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
