name: App Android

# Compila la app de CONECTA para Android (apps/mobile):
#   - APK de prueba, para instalar directo en un teléfono (siempre).
#   - AAB firmado para Play Store (solo si están los secretos de la llave de firma).
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
#   CONECTA_URL     Dirección pública de CONECTA con https (obligatoria para el AAB de Play Store).
#   CONECTA_APP_ID  Identificador en Play Store (opcional; por defecto com.jcsystem.conecta).
# Secretos (Settings → Secrets and variables → Actions → Secrets):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON  (opcional: el archivo de Firebase, para los avisos del teléfono)
# Ver apps/mobile/README.md.

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compilar la app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONECTA_URL: ${{ vars.CONECTA_URL }}
      CONECTA_APP_ID: ${{ vars.CONECTA_APP_ID }}
      # Play Store pide que el número de versión siempre suba: se usa el número de esta compilación.
      CONECTA_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Revisar la configuración de la app
        run: pnpm --filter @escolar/mobile typecheck
      - name: Archivo de Firebase (avisos del teléfono)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/android/app/google-services.json
            echo "Con avisos del teléfono (Firebase)."
          else
            echo "::notice::Sin GOOGLE_SERVICES_JSON: la app se compila sin avisos del teléfono."
          fi
      - name: Preparar la app (Capacitor)
        run: pnpm --filter @escolar/mobile sync
      - name: APK de prueba
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: conecta-prueba-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Llave de firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Sin llave de firma: solo se compiló el APK de prueba."
            echo "lista=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CONECTA_URL" ]; then
            echo "::error::Falta la variable CONECTA_URL (la dirección https de CONECTA) para la versión de Play Store."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/conecta.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/conecta.keystore" >> "$GITHUB_ENV"
          echo "lista=si" >> "$GITHUB_OUTPUT"
      - name: AAB firmado para Play Store
        if: steps.firma.outputs.lista == 'si'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace
      - if: steps.firma.outputs.lista == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: conecta-play-store-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Borrar la llave del equipo
        if: always()
        run: rm -f "$RUNNER_TEMP/conecta.keystore"
