name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependencias sin vulnerabilidades conocidas (altas o críticas)
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Sintetizar infraestructura (CDK)
        env:
          CDK_DEFAULT_REGION: us-east-1
        run: >
          pnpm --filter @escolar/infra synth
          -c jwtSecretArn=arn:aws:secretsmanager:us-east-1:111111111111:secret:ci-placeholder-AbCdEf

  imagenes:
    name: Imagen Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: identity
            dockerfile: services/identity/Dockerfile
          - name: academic
            dockerfile: services/academic/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
